
name: Deploy EventOS Backend

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: eventos123/eventos-backend:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.sha }}
          DOCKER_IMAGE: eventos123/eventos-backend
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG,DOCKER_IMAGE
          script: |
            set -eu

            IMAGE="${DOCKER_IMAGE}:${IMAGE_TAG}"
            PREVIOUS_IMAGE=$(sudo docker inspect --format '{{.Config.Image}}' eventos-backend 2>/dev/null || true)

            sudo docker pull "$IMAGE"
            sudo docker rm -f eventos-backend 2>/dev/null || true

            if ! sudo docker run -d \
              --name eventos-backend \
              --restart unless-stopped \
              --env-file /opt/eventos/.env \
              -p 127.0.0.1:5000:5000 \
              "$IMAGE"; then

              if [ -n "$PREVIOUS_IMAGE" ]; then
                sudo docker run -d \
                  --name eventos-backend \
                  --restart unless-stopped \
                  --env-file /opt/eventos/.env \
                  -p 127.0.0.1:5000:5000 \
                  "$PREVIOUS_IMAGE"
              fi
              exit 1
            fi

            HEALTHY=0
            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:5000/health >/dev/null; then
                HEALTHY=1
                break
              fi
              sleep 2
            done

            if [ "$HEALTHY" -ne 1 ]; then
              sudo docker logs --tail 50 eventos-backend || true
              sudo docker rm -f eventos-backend || true

              if [ -n "$PREVIOUS_IMAGE" ]; then
                sudo docker run -d \
                  --name eventos-backend \
                  --restart unless-stopped \
                  --env-file /opt/eventos/.env \
                  -p 127.0.0.1:5000:5000 \
                  "$PREVIOUS_IMAGE"
              fi
              exit 1
            fi

            sudo docker image prune -af
            echo "Backend deployment successful: $IMAGE"
